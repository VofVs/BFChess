<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Battlefield Chess v0.18</title>
<meta name="theme-color" content="#15120f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BF Chess" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />

<style>
:root{--bg:#15120f;--panel:#241d18;--ink:#f5ead7;--muted:#baac98;--accent:#f3cc75;--north:#d43b32;--south:#2e7fe0;--cw:36px;--ch:24px;--tw:26px;--th:21px;--icon:14px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(circle at 50% 0,#2b2118,#100e0c 62%);color:var(--ink);font:14px system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
.app{height:100dvh;max-width:520px;margin:auto;padding:calc(5px + env(safe-area-inset-top)) 7px calc(6px + env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:0}
button{border:1px solid #5a4938;background:#2a211b;color:var(--ink);border-radius:10px;min-height:44px;min-width:44px;padding:8px 12px;font-weight:700;font-size:14px;touch-action:manipulation}
button:disabled{opacity:.35}
.bar{height:50px;flex:0 0 50px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:1px 1px 5px;gap:8px}
.turns{justify-self:start;display:flex;gap:9px;align-items:center}
.turnMark{font:900 24px/1 Georgia,serif;color:#fff;opacity:.95;text-shadow:0 2px 3px #000;transition:color .12s,transform .12s}
.turnMark.active{transform:scale(1.08)}
.turnMark.north.active{color:var(--north)}
.turnMark.south.active{color:var(--south)}
.clock{justify-self:center;font-variant-numeric:tabular-nums;font-weight:900;font-size:20px;letter-spacing:.5px;min-width:82px;text-align:center;color:#f5ead7}
.clock.danger{color:#ff8f79}
#menuBtn{justify-self:end;padding:6px 11px;font-size:20px;line-height:1}
.scene{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:12px;background:#0b090733;border:1px solid #2f251e;box-shadow:inset 0 0 26px #0008}
.board{position:absolute;left:50%;top:50%;display:grid;grid-template-columns:repeat(9,var(--cw));grid-template-rows:repeat(29,var(--ch));gap:1px;width:max-content;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 9px #0008)}
.sq{width:var(--cw);height:var(--ch);min-width:0;min-height:0;position:relative;border:0;padding:0;border-radius:2px;overflow:visible;touch-action:manipulation;box-shadow:inset 0 1px #ffffff22}
.sq::after{content:"";position:absolute;left:1px;right:1px;bottom:-2px;height:3px;background:#38291f;clip-path:polygon(0 0,100% 0,96% 100%,4% 100%);filter:brightness(.72);z-index:-1}
.void{visibility:hidden;pointer-events:none}
.field{background:radial-gradient(circle at 25% 30%,#9bc45f55 0 8%,transparent 9%),radial-gradient(circle at 70% 65%,#29451d66 0 9%,transparent 10%),repeating-linear-gradient(78deg,transparent 0 6px,#cce89912 6px 7px),linear-gradient(135deg,#759f48,#4f772f 58%,#3d6128)}
.field::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 0 45%,#fff1 46%,transparent 49%);opacity:.45}
.front{background:radial-gradient(ellipse at 30% 35%,#26170e88 0 15%,transparent 16%),radial-gradient(ellipse at 70% 70%,#a77a4a55 0 13%,transparent 14%),repeating-linear-gradient(10deg,transparent 0 7px,#2d1b1288 8px 9px),linear-gradient(135deg,#6b4a32,#463126 60%,#33251e)}
.front::after{background:#2c211b}.front.contested{box-shadow:inset 0 0 0 1px #ad5b42,inset 0 1px #fff2}
.inner{background:radial-gradient(circle at 22% 27%,#49301f55 0 5%,transparent 6%),radial-gradient(circle at 70% 62%,#f3d59933 0 5%,transparent 6%),linear-gradient(135deg,#b8884f,#8e633b 58%,#745031)}
.inner::after{background:#5e3f27}
.outer{background:repeating-linear-gradient(90deg,#8b5b31 0 6px,#633c22 6px 8px,#96653a 8px 14px,#51311e 14px 16px);box-shadow:inset 0 3px #b8854a55,inset 0 -3px #27160d66}
.outer::before{content:"";position:absolute;left:2px;right:2px;top:2px;height:3px;background:#392116aa;border-radius:4px;box-shadow:0 calc(var(--ch) - 7px) #39211677}
.outer::after{height:4px;bottom:-3px;background:#3b2418}
.gate{background:repeating-linear-gradient(0deg,#9b663a 0 4px,#54321e 4px 6px,#81502c 6px 10px);box-shadow:inset 0 0 0 2px #342014,inset 0 2px #c38b5455}
.gate::before{content:"";position:absolute;left:18%;right:18%;top:2px;bottom:2px;border-left:2px solid #3b2316;border-right:2px solid #3b2316}
.gate::after{height:4px;bottom:-3px;background:#27180f}
.gate.breached{background:radial-gradient(circle at 25% 30%,#49301f55 0 5%,transparent 6%),linear-gradient(135deg,#b8884f,#8e633b 58%,#745031)}
.gate.breached::before{display:none}.gate.breached::after{background:#5e3f27}
.token{position:absolute;left:calc((var(--cw) - var(--tw))/2);top:calc((var(--ch) - var(--th))/2 - 1px);width:var(--tw);height:var(--th);clip-path:polygon(25% 4%,75% 4%,98% 50%,75% 96%,25% 96%,2% 50%);display:grid;place-items:center;z-index:5;filter:drop-shadow(0 3px 1px #0009);color:#f5ead7}
.token::before{content:"";position:absolute;inset:0;clip-path:inherit;background:linear-gradient(#ffffff2f,transparent 32%),var(--token);box-shadow:inset 0 0 0 2px #fff3}
.token::after{content:"";position:absolute;inset:3px;clip-path:inherit;background:#15110d22;box-shadow:inset 0 0 0 1px #fff2}
.token.north{--token:linear-gradient(145deg,#e1574d,#a51f1b 65%,#681713)}
.token.south{--token:linear-gradient(145deg,#4a95ef,#175eb8 65%,#0d396f)}
.token svg{position:relative;z-index:2;width:var(--icon);height:var(--icon);overflow:visible;stroke:currentColor;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.token .fill{fill:currentColor;stroke:none}
.selected{outline:2px solid #ffd56b;outline-offset:0;z-index:15}
.selected .token{filter:drop-shadow(0 0 4px #ffd56b) drop-shadow(0 3px 1px #0009)}
.move::before{content:"";position:absolute;left:50%;top:50%;width:max(6px,calc(var(--ch) * .30));height:max(6px,calc(var(--ch) * .30));border-radius:50%;background:#ffe08c;box-shadow:0 0 6px #ffd15d;z-index:12;transform:translate(-50%,-50%)}
.attack::before{content:"";position:absolute;inset:1px;border:2px solid #ffcb62;border-radius:3px;box-shadow:inset 0 0 6px #ffb12988,0 0 5px #ffb12988;z-index:12}
.thinking{opacity:.76;pointer-events:none}
.resultBanner{position:absolute;left:50%;top:7px;transform:translateX(-50%);z-index:40;max-width:90%;padding:7px 12px;border:1px solid #7f674b;border-radius:999px;background:#17110eee;color:#f5ead7;font-weight:800;text-align:center;box-shadow:0 5px 16px #0009;pointer-events:none}
.resultBanner.hidden,.legacyHidden{display:none!important}
.menuOverlay{position:fixed;inset:0;z-index:200;background:#0d0a08ed;display:grid;align-items:start;justify-items:center;overflow:auto;padding:calc(18px + env(safe-area-inset-top)) 10px calc(24px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
.menuOverlay.hidden{display:none}
.menuPanel{width:min(100%,500px);background:#211a15;border:1px solid #5a4938;border-radius:16px;padding:14px;box-shadow:0 18px 60px #000a}
.menuHead{display:flex;align-items:center;gap:8px;margin-bottom:12px}.menuHead h2{margin:0;flex:1;font-family:Georgia,serif;font-size:24px}.menuHead .clock{font-size:20px}
.menuActions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.menuActions button{width:100%;min-height:52px}.menuActions .wide{grid-column:1/-1}
.menuView.hidden{display:none}
.ruleBlock{border-top:1px solid #49392c;padding:10px 0}.ruleBlock:first-child{border-top:0}.ruleBlock h3{margin:0 0 5px;font:700 17px Georgia,serif}.ruleBlock p{margin:4px 0;color:#d8c9b6;line-height:1.4}
.masKey{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 12px}.masKey div{background:#18120f;border:1px solid #49392c;border-radius:9px;padding:8px;font-size:12px}
.pieceRule{border:1px solid #49392c;border-radius:11px;padding:9px;margin:8px 0;background:#18120f}.pieceRule b{font-family:Georgia,serif;font-size:16px}.pieceRule dl{display:grid;grid-template-columns:22px 1fr;gap:4px 7px;margin:6px 0 0}.pieceRule dt{font-weight:900;color:#f3cc75}.pieceRule dd{margin:0;color:#d8c9b6;line-height:1.35}
.statsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.statBox{background:#18120f;border:1px solid #49392c;border-radius:10px;padding:10px;text-align:center}.statBox strong{display:block;font-size:22px}.statBox span{font-size:11px;color:#baac98}
.pb{padding:10px;border:1px solid #6a563f;border-radius:10px;background:#2a211b;margin:8px 0}.recent{font-variant-numeric:tabular-nums;font-size:12px;color:#d8c9b6;line-height:1.6}.installHint{font-size:11px;color:#baac98;margin-top:12px}.pausedTag{display:inline-block;font-size:10px;padding:3px 6px;border:1px solid #8a6e50;border-radius:999px;color:#f3cc75;margin-left:6px}
.small{font-size:11px;color:var(--muted)}
@media(orientation:landscape) and (max-height:520px){.bar{height:44px;flex-basis:44px}.turnMark{font-size:20px}.clock{font-size:17px}#menuBtn{min-height:40px;min-width:40px}}
</style>

</head>
<body><div class="app">
<div class="bar">
  <div class="turns" aria-label="Turn indicator"><span id="turnN" class="turnMark north">N</span><span id="turnS" class="turnMark south">S</span></div>
  <div id="clock" class="clock" aria-label="Match timer">00:00.0</div>
  <button id="menuBtn" aria-label="Open menu">☰</button>
</div>
<div id="scene" class="scene">
  <div id="resultBanner" class="resultBanner hidden"></div>
  <div id="board" class="board"></div>
</div>
<div class="legacyHidden" aria-hidden="true">
  <span id="status"></span><span id="turn"></span><span id="info"></span><span id="nroster"></span><span id="sroster"></span><span id="nstate"></span><span id="sstate"></span><span id="frontmsg"></span>
</div>
</div>
<div id="menuOverlay" class="menuOverlay hidden" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
  <section class="menuPanel">
    <div class="menuHead"><h2 id="menuTitle">Battlefield Chess <span class="pausedTag">PAUSED</span></h2><div id="menuClock" class="clock">00:00.0</div></div>
    <div id="menuHome" class="menuView">
      <div class="menuActions">
        <button id="resumeBtn" class="wide">Resume</button>
        <button id="undo">Undo</button>
        <button id="pass">Pass Turn</button>
        <button id="restartBtn">Restart</button>
        <button id="rulesBtn">Rules</button>
        <button id="piecesBtn">Pieces / M·A·S</button>
        <button id="statsBtn">Stats</button>
      </div>
      <p class="installHint">iPhone install: open the GitHub Pages version in Safari → Share → Add to Home Screen.</p>
    </div>
    <div id="rulesView" class="menuView hidden"><div id="rulesContent"></div><button class="backBtn">← Menu</button></div>
    <div id="piecesView" class="menuView hidden"><div class="masKey"><div><b>M</b><br>Move</div><div><b>A</b><br>Attack</div><div><b>S</b><br>Special</div></div><div id="pieceRules"></div><button class="backBtn">← Menu</button></div>
    <div id="statsView" class="menuView hidden"><div id="statsContent"></div><button class="backBtn">← Menu</button></div>
  </section>
</div>
<script>
const SIDE={N:{id:'N',name:'North',enemy:'S',dir:1,near:4,homeMin:6,homeMax:15},S:{id:'S',name:'South',enemy:'N',dir:-1,near:24,homeMin:13,homeMax:22}};
const N={commander:'Commander',guard:'Guard',infantry:'Infantry',cavalry:'Cavalry',chariot:'Chariot',archer:'Archer',elephant:'Elephant',spy:'Spy',siege:'Siege'};
const V={commander:1000,guard:4,infantry:3,cavalry:8,chariot:10,archer:7,elephant:9,spy:6,siege:5};
const TYPES=['infantry','cavalry','chariot','archer','spy','elephant','siege'];
const CAP={infantry:3,cavalry:3,chariot:3,archer:3,spy:3,elephant:3,siege:3};
const ICON={
 infantry:'<path d="M26 5 10 24M27 4l4 4-6 6-4-4M8 21l8 7M7 29l7-7"/>',
 chariot:'<path d="M5 14h21l4 10H9z"/><circle cx="12" cy="28" r="4"/><circle cx="26" cy="28" r="4"/><path d="M26 14l6-5"/>',
 cavalry:'<path class="fill" d="M9 29c1-7 3-12 7-16l-3-7 8 3 6-7 1 9c6 4 7 10 6 17H24c0-4-2-6-5-7-2 2-4 5-5 8z"/>',
 elephant:'<path class="fill" d="M7 10c3-5 8-7 13-7 8 0 14 5 15 13 1 7-2 11-7 14l-1 5h-7l1-9c-2-1-4-2-6-4-2 3-5 4-9 4-3 0-5-1-6-4 4-1 7-4 7-7z"/>',
 archer:'<path d="M9 3c15 7 15 24 0 31M10 3l12 16-12 15M6 19h27m-6-4 6 4-6 4"/>',
 commander:'<path d="M10 34V3M12 5h19l-5 7 5 7H12zM5 34h11"/>',
 guard:'<path class="fill" d="M18 2 31 7v10c0 9-5 16-13 20C10 33 5 26 5 17V7z"/>',
 spy:'<path class="fill" d="M2 13c6-5 11-6 17-3 6-3 11-2 17 3l-3 12c-6 3-10 2-14-2-4 4-8 5-14 2z"/><path d="M7 16c4-2 7-2 9 0-1 4-3 5-7 5m20-5c-4-2-7-2-9 0 1 4 3 5 7 5" stroke="#2b1a15"/>',
 siege:'<circle cx="10" cy="29" r="4"/><circle cx="28" cy="29" r="4"/><path d="M8 24h22M9 12h22l5 5-5 5H9z"/><path d="M9 12 4 8m5 14-5 4"/>'
};
let G,H=[],aiTimer=null;
const $=id=>document.getElementById(id),board=$('board');
const STATS_KEY='bfchess.stats.v1';
let matchMs=0,clockTimer=null,clockLast=0,menuOpen=false,resultLogged=false;
const PIECE_MAS={
 commander:{M:'1 square in any of 8 directions.',A:'Capture by moving onto an adjacent enemy.',S:'Confined to your own Inner Camp.'},
 guard:{M:'1 square cardinally (N/S/E/W).',A:'Capture by moving onto an adjacent cardinal enemy.',S:'Confined to your own Inner Camp.'},
 infantry:{M:'1 square in any direction.',A:'Front, both front diagonals, and directly left/right.',S:'May capture in open Field; most other units cannot.'},
 cavalry:{M:'1–3 squares along straight-forward, forward-left, or forward-right rays. May stop at any open square; cannot jump.',A:'Exactly 1 square directly left or right.',S:'No backward movement.'},
 chariot:{M:'1–5 squares along straight-forward, forward-left, or forward-right rays. May stop at any open square; cannot jump.',A:'Exactly 1 square directly left or right.',S:'No backward movement.'},
 archer:{M:'1 square in any direction.',A:'Shoot an enemy up to 5 squares straight forward without moving.',S:'Shots pass over units and Gates. Normal shots target combat zones, not open Field.'},
 elephant:{M:'1 or 2 squares in any of 8 directions; cannot jump.',A:'Capture 1 or 2 squares in any of 8 directions.',S:'Can breach an enemy Gate.'},
 spy:{M:'Exactly 2 squares in any of 8 directions; cannot jump.',A:'No normal attack.',S:'In open Field, sacrifice the Spy to convert the target to your side. Conversion consumes the turn.'},
 siege:{M:'Exactly 1 square straight forward.',A:'Cannot attack ordinary pieces.',S:'Breaches an enemy Gate. Cannot advance out of the home Camp/Gate while the rear home Battlefield is invaded.'}
};
function fmtTime(ms){ms=Math.max(0,ms);let total=Math.floor(ms/100),tenths=total%10,sec=Math.floor(total/10)%60,min=Math.floor(total/600);return String(min).padStart(2,'0')+':'+String(sec).padStart(2,'0')+'.'+tenths}
function readStats(){try{return JSON.parse(localStorage.getItem(STATS_KEY))||{wins:0,losses:0,draws:0,bestMs:null,recent:[]}}catch(e){return{wins:0,losses:0,draws:0,bestMs:null,recent:[]}}}
function writeStats(x){try{localStorage.setItem(STATS_KEY,JSON.stringify(x))}catch(e){}}
function elapsedMs(){return matchMs}
function recordResult(){if(resultLogged||(!G.winner&&!G.draw))return;resultLogged=true;let st=readStats(),result=G.draw?'draw':G.winner==='S'?'win':'loss',ms=Math.max(0,elapsedMs());if(result==='win'){st.wins++;if(st.bestMs==null||ms<st.bestMs)st.bestMs=ms}else if(result==='loss')st.losses++;else st.draws++;st.recent=Array.isArray(st.recent)?st.recent:[];st.recent.unshift({result,ms,at:Date.now()});st.recent=st.recent.slice(0,12);writeStats(st);renderStats()}
function renderStats(){let st=readStats(),recent=(st.recent||[]).slice(0,8).map(x=>`${x.result.toUpperCase()} — ${fmtTime(x.ms)}`).join('<br>')||'No completed matches yet.';$('statsContent').innerHTML=`<h3>Record</h3><div class="statsGrid"><div class="statBox"><strong>${st.wins||0}</strong><span>Victories</span></div><div class="statBox"><strong>${st.losses||0}</strong><span>Losses</span></div><div class="statBox"><strong>${st.draws||0}</strong><span>Draws</span></div></div><div class="pb"><b>Personal Best</b><br>${st.bestMs==null?'—':fmtTime(st.bestMs)} <span class="small">fastest victory</span></div><div class="recent"><b>Recent matches</b><br>${recent}</div>`}
function paintClock(){let txt=fmtTime(matchMs);$('clock').textContent=txt;$('menuClock').textContent=txt;$('clock').classList.remove('danger');$('menuClock').classList.remove('danger')}
function clockStep(){if(menuOpen||G.winner||G.draw)return;let now=Date.now();if(clockLast)matchMs+=Math.max(0,now-clockLast);clockLast=now;paintClock()}
function startClock(){if(menuOpen||G.winner||G.draw)return;clearInterval(clockTimer);clockLast=Date.now();clockTimer=setInterval(clockStep,100);paintClock()}
function pauseClock(){if(clockLast){let now=Date.now();matchMs+=Math.max(0,now-clockLast)}clearInterval(clockTimer);clockTimer=null;clockLast=0;paintClock()}
function showMenuView(id){for(const v of document.querySelectorAll('.menuView'))v.classList.add('hidden');$(id).classList.remove('hidden')}
function openMenu(){if(menuOpen)return;menuOpen=true;pauseClock();if(aiTimer){clearTimeout(aiTimer);aiTimer=null}$('menuOverlay').classList.remove('hidden');showMenuView('menuHome');renderStats()}
function closeMenu(){if(!menuOpen)return;menuOpen=false;$('menuOverlay').classList.add('hidden');startClock();if(G.thinking&&!G.winner&&!G.draw&&!aiTimer)aiTimer=setTimeout(ai,220)}
function resetMatch(){clearTimeout(aiTimer);aiTimer=null;clearInterval(clockTimer);clockTimer=null;H=[];G=fresh();begin('S');matchMs=0;resultLogged=false;menuOpen=false;$('menuOverlay').classList.add('hidden');render();focusSouth();startClock()}
function buildHelp(){
 $('rulesContent').innerHTML=`<div class="ruleBlock"><h3>Objective</h3><p>The clock is a stopwatch, not a loss condition. It counts upward for match records and pauses while the menu is open.</p></div><div class="ruleBlock"><h3>Army composition</h3><p>Each army has exactly one Commander and one Guard, at least one Gate-breaching unit, and no more than three copies of any other piece type.</p></div><div class="ruleBlock"><h3>Three ways to win</h3><p>Capture the enemy Commander; eliminate every enemy non-Commander unit; or maintain enemy superiority inside the enemy Inner Camp across two starts of that defender’s turns.</p></div><div class="ruleBlock"><h3>Battlefield combat</h3><p>Most ordinary captures only happen on the muddy Front Lines, in Camps, or on Gate squares. Infantry can fight in open Field. Spies convert in open Field.</p></div><div class="ruleBlock"><h3>Front Lines</h3><p>Your own units never block your crossing. If an enemy occupies any Front Line row, your side cannot cross fully into the enemy half until that presence is removed. If both sides occupy the Front, both are blocked.</p></div><div class="ruleBlock"><h3>Gates</h3><p>Intact enemy Gates block ordinary entry. Siege and Elephant can breach them permanently. Archer fire passes over Gates.</p></div><div class="ruleBlock"><h3>Draw</h3><p>A draw occurs when neither side can ever breach the opposing Gate: its target Gate is still intact and that side has no surviving Siege or Elephant.</p></div>`;
 $('pieceRules').innerHTML=Object.keys(PIECE_MAS).map(t=>`<article class="pieceRule"><b>${N[t]}</b><dl><dt>M</dt><dd>${PIECE_MAS[t].M}</dd><dt>A</dt><dd>${PIECE_MAS[t].A}</dd><dt>S</dt><dd>${PIECE_MAS[t].S}</dd></dl></article>`).join('');
}

function zone(r,c){if(r>=0&&r<=4&&c>=2&&c<=6)return{kind:r<=2&&c>=3&&c<=5?'inner':'outer',side:'N'};if(r===5&&c===4)return{kind:'gate',side:'N'};if(r>=6&&r<=22)return{kind:r>=13&&r<=15?'front':'field',side:null};if(r===23&&c===4)return{kind:'gate',side:'S'};if(r>=24&&r<=28&&c>=2&&c<=6)return{kind:r>=26&&c>=3&&c<=5?'inner':'outer',side:'S'};return{kind:'void',side:null}}
const active=(r,c)=>r>=0&&r<29&&c>=0&&c<9&&zone(r,c).kind!=='void',at=(r,c)=>G.pieces.find(p=>p.r===r&&p.c===c)||null,camp=k=>k==='inner'||k==='outer',combat=(r,c)=>{let z=zone(r,c);return z.kind==='front'||z.kind==='gate'||camp(z.kind)},row=(s,d)=>SIDE[s].near-SIDE[s].dir*d,mk=(s,t,r,c)=>({id:s+t+Math.random(),side:s,type:t,r,c});
function fp(){return{N:G.pieces.some(p=>p.side==='N'&&zone(p.r,p.c).kind==='front'),S:G.pieces.some(p=>p.side==='S'&&zone(p.r,p.c).kind==='front')}}
function counts(s){let f=0,e=0;for(const p of G.pieces){let z=zone(p.r,p.c);if(z.kind==='inner'&&z.side===s)(p.side===s?f++:e++)}return{f,e}}
function sideState(s){let q=fp(),c=counts(s),S=SIDE[s];return{S,E:SIDE[S.enemy],blocked:q[S.enemy],own:q[s],rear:G.pieces.some(p=>p.side!==s&&p.r>=S.homeMin&&p.r<=S.homeMax),f:c.f,e:c.e,pressure:c.e>c.f,breached:G.breached[s]}}
function ctx(p){return{p,...sideState(p.side)}}
function crosses(x,r){if(!x.blocked)return false;return x.S.id==='N'?(x.p.r<=15&&r>=16):(x.p.r>=13&&r<=12)}
function hostileGate(x,r,c){let z=zone(r,c);return z.kind==='gate'&&z.side===x.E.id&&!G.breached[z.side]}
