name: One-shot iPhone UI hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair index and service worker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('id="turnC" class="turnMark south"','id="turnS" class="turnMark south"')
          bad="if('serviceWorker' in navigator7)window.addEventListener('Road',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));\nserviceWorker.register('./sw.js').catch(()=>{}));"
          good="if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));"
          if bad in s:
              s=s.replace(bad,good)
          else:
              s=s.replace("if('serviceWorker' in navigator7)","if('serviceWorker' in navigator)")
              s=s.replace("window.addEventListener('Road'","window.addEventListener('load'")
              s=s.replace("\nserviceWorker.register('./sw.js').catch(()=>{}));\n</script>","\n</script>")
          s=s.replace('<title>Battlefield Chess v0.17</title>','<title>Battlefield Chess v0.17.1</title>')
          p.write_text(s)
          Path('sw.js').write_text("""const CACHE='bfchess-v0171-hotfix';
          const CORE=['./','./index.html','./manifest.webmanifest','./icon.svg'];
          self.addEventListener('install',event=>event.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',event=>event.waitUntil(Promise.all([
            caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))),
            self.clients.claim()
          ])));
          self.addEventListener('fetch',event=>{
            const req=event.request;
            if(req.mode==='navigate'){
              event.respondWith(fetch(req).then(res=>{const copy=res.clone();caches.open(CACHE).then(c=>c.put('./index.html',copy));return res;}).catch(()=>caches.match('./index.html').then(r=>r||caches.match('./'))));
              return;
            }
            event.respondWith(caches.match(req).then(hit=>hit||fetch(req).then(res=>{if(req.method==='GET'&&res.ok){const copy=res.clone();caches.open(CACHE).then(c=>c.put(req,copy));}return res;})));
          });
          """)
          PY
          rm .github/workflows/ui-hotfix.yml
      - name: Verify JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          assert m, 'inline script not found'
          Path('/tmp/bfcheck.js').write_text(m.group(1))
          assert 'turnC' not in s
          assert 'navigator7' not in s
          assert "addEventListener('Road'" not in s
          PY
          node --check /tmp/bfcheck.js
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js .github/workflows/ui-hotfix.yml
          git commit -m 'Fix broken iPhone UI and stale cache handling'
          git push
