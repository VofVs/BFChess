name: Finalize v0.17 timer update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-v016.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extend match to two minutes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text()
          text=text.replace('Battlefield Chess v0.16','Battlefield Chess v0.17')
          text=text.replace('01:30.0','02:00.0')
          text=text.replace('const LIMIT_MS=90000', 'const LIMIT_MS=120000')
          text=text.replace('Win before 1:30.', 'Win before 2:00.')
          text=text.replace('v0.16 — 90 seconds.', 'v0.17 — 120 seconds.')
          p.write_text(text)
          sw=Path('sw.js')
          s=sw.read_text().replace("const CACHE='bfchess-v016';","const CACHE='bfchess-v017';")
          sw.write_text(s)
          PY
      - name: Commit final v0.17
        shell: bash
        run: |
          git config user.name "VofVs"
          git config user.email "vynnilucien@gmail.com"
          git rm .github/workflows/patch-v016.yml
          git add index.html sw.js
          git commit -m "BFChess v0.17: two-minute matches"
          git push origin main
